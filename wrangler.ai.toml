# Cloudflare Worker Configuration for AI Config Generator
name = "ai-config-generator"
main = "workers/ai-config-generator.ts"
compatibility_date = "2025-01-01"

# AI Binding (fallback, but we'll use AI Gateway for longer timeouts)
ai = { binding = "AI" }

# Environment variables (set these in your .dev.vars file for local dev)
# Or use wrangler secret put for production
# Required for AI Gateway:
# - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
# - CLOUDFLARE_API_TOKEN: API token with AI Gateway permissions
# - AI_GATEWAY_ID: Your AI Gateway slug/ID

# Development settings
[env.development]
name = "ai-config-generator-dev"
